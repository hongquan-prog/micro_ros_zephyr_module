# Phase 1 (stub heartbeat) configuration.

CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_PWM_ROCKCHIP=y

# Kernel timebase (systick); the 1 ms signal chain tick uses timer0.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Console/log output.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y

# Hardware 1 ms tick: RK3588 bus timer counter driver (timer0).
CONFIG_COUNTER=y

# Keep the RTOS-side latency measurements clean: silence everything below
# ERROR at compile time (module-level LOG_LEVEL_INF declarations are
# overridden by this).
CONFIG_LOG_OVERRIDE_LEVEL=1

# Pin the signal-chain thread to CPU0. The rk_timer SPI is already
# delivered on CPU0 (the GICv3 driver routes an SPI to the PE that called
# irq_enable(), i.e. the boot CPU), so ISR and consumer stay on the same
# core: no cross-core wakeup latency/jitter in the GPIO1->GPIO2 leg.
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
