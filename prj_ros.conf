# Phase 2 (real DDS over micro-ROS) extra configuration.
# Build with: -DEXTRA_CONF_FILE=prj_ros.conf
#
# Transport: ZVisor shared-memory VM channel between the zephyr guest and
# Linux (see the zv_shm node in the board overlay; HVC doorbell on TX,
# virtual IRQ 41 on RX).

CONFIG_DEMO_HEARTBEAT_MICROROS=y

# micro-ROS runtime requirements.
CONFIG_CPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n
CONFIG_POSIX_API=y

# ZVisor shared-memory transport.
CONFIG_MICROROS_TRANSPORT_ZVISOR_SHMEM=y
