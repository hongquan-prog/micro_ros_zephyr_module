# Phase 1 (stub heartbeat) configuration.

CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_PWM_ROCKCHIP=y

# 1 ms systick for the signal chain.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Console/log output.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y

# Pin the signal-chain thread to CPU0 (same core as the tick interrupt):
# no cross-core wakeup latency/jitter in the GPIO1->GPIO2 leg.
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y

# DDS diagnostic shell (dds status/stats/shm).
# Interrupt-driven serial backend is disabled: the RK3588 uart2 IRQ mode
# hangs at boot (see TODO #9); the polling backend works.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=n
# Keep the shell below the control thread (prio 0) so typing commands
# does not perturb the 1 ms signal chain.
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=5
