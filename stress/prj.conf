# Stress-test app: same transport configuration as the root prj.conf
# (ZVisor shared memory by default; use -DEXTRA_CONF_FILE=../agent_test.conf
# for the OpenAMP/RPMsg variant).
CONFIG_MICROROS=y
CONFIG_CPP=y

# rock_5b_plus.dts only describes the 4 Cortex-A55 cores
CONFIG_MP_MAX_NUM_CPUS=4

CONFIG_MAIN_STACK_SIZE=25000
CONFIG_MAIN_THREAD_PRIORITY=3

CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n

CONFIG_POSIX_API=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_SERIAL=y

# micro-ROS over ZVisor shared memory (HVC doorbells)
CONFIG_MICROROS_TRANSPORT_ZVISOR_SHMEM=y
CONFIG_IPM=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

# RPMsg payload is limited to 512 - 16 (vring header) = 496 bytes
CONFIG_MICROROS_XRCE_DDS_MTU="496"
