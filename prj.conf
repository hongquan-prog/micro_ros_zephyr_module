# Phase 1 (stub heartbeat) configuration.

CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_PWM_ROCKCHIP=y

# Kernel timebase (systick); the 1 ms signal chain tick uses timer0.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Console/log output.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y

# Hardware 1 ms tick: RK3588 bus timer counter driver (timer0).
CONFIG_COUNTER=y

# Keep the RTOS-side latency measurements clean: silence everything below
# ERROR at compile time (module-level LOG_LEVEL_INF declarations are
# overridden by this).
CONFIG_LOG_OVERRIDE_LEVEL=1
