# Phase 1 (stub heartbeat) configuration.

CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_PWM_ROCKCHIP=y

# 1 ms systick for the signal chain.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Console/log output.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y

# Pin the signal-chain thread to CPU0 (same core as the tick interrupt):
# no cross-core wakeup latency/jitter in the GPIO1->GPIO2 leg.
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
