# PWM/DDS demo configuration.
#
# The heartbeat backend defaults to the real DDS (micro-ROS) via the
# Kconfig choice; build the stub variant with -DCONFIG_DEMO_HEARTBEAT_STUB=y
# (or the -DDDS_STUB=y alias).

CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_PWM_ROCKCHIP=y

# 1 ms systick for the signal chain.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Console/log output.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y

# Newlib (required by micro-ROS; the stub build uses it too so the two
# backends share a single libc).
CONFIG_NEWLIB_LIBC=y

# Pin the signal-chain thread to CPU0 (same core as the tick interrupt):
# no cross-core wakeup latency/jitter in the GPIO1->GPIO2 leg.
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y

# Counter subsystem (used when DEMO_RK_TIMER=y drives the tick from the
# RK3588 bus timer; harmless when the systick path is active).
CONFIG_COUNTER=y

# Demo shell: "dds" diagnostics (status/stats/shm) + "hb" tuning (period/freq).
# Interrupt-driven serial backend is disabled: the RK3588 uart2 IRQ mode
# hangs at boot (see TODO #9); the polling backend works.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=n
# Keep the shell below the control thread (prio 0) so typing commands
# does not perturb the 1 ms signal chain.
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=5
